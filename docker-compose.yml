services:
  api:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8000:8000"
  frontend:
    build: .
    command: streamlit run app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      LEGALEASE_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
